<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment #4 - Simple Payroll</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Assignment #4 - Simple Payroll</h1></header>
<main><div class="card">
  <p class="note">The first 40 hours are paid at the normal rate. Anything beyond that is overtime at 1.5 times the rate.</p>
  <label for="name">Employee name</label>
  <input type="text" id="name" placeholder="e.g. Juan Dela Cruz">
  <label for="hours">Hours worked</label>
  <input type="number" id="hours" min="0" step="any" placeholder="e.g. 45">
  <label for="rate">Hourly rate (PHP)</label>
  <input type="number" id="rate" min="0" step="any" placeholder="e.g. 120">
  <label for="ded">Deductions (PHP)</label>
  <input type="number" id="ded" min="0" step="any" value="0">
  <button onclick="payroll()">Calculate pay</button>
  <div class="result" id="result">Your answer will show up here.</div>
  <a class="back" href="index.html">Back to all assignments</a>
</div></main>
<script>
function payroll() {
  var name = document.getElementById("name").value || "Your employee";
  var hours = parseFloat(document.getElementById("hours").value);
  var rate = parseFloat(document.getElementById("rate").value);
  var ded = parseFloat(document.getElementById("ded").value);
  var out = document.getElementById("result");
  if (isNaN(hours) || isNaN(rate) || hours < 0 || rate < 0) { out.innerHTML = "Please fill in the hours worked and the hourly rate."; return; }
  if (isNaN(ded)) ded = 0;
  var regular = Math.min(hours, 40), overtime = Math.max(hours - 40, 0);
  var regPay = regular * rate, otPay = overtime * rate * 1.5;
  var gross = regPay + otPay, net = gross - ded;
  out.innerHTML = "<b>" + name + "</b>'s pay<br>Regular pay: PHP " + regPay.toFixed(2) +
    "<br>Overtime pay: PHP " + otPay.toFixed(2) + "<br>Gross pay: PHP " + gross.toFixed(2) +
    "<br>Deductions: PHP " + ded.toFixed(2) + "<br><b>Take-home pay: PHP " + net.toFixed(2) + "</b>";
}
</script></body></html>
